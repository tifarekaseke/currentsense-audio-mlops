services:
  api:
    build: .
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in your .env}
      - RETRAIN_ENABLED=${RETRAIN_ENABLED:-true}
      - MODEL_PATH=models/current_sense_audio.pkl
      - DB_PATH=data/current_sense.sqlite3
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./outputs:/app/outputs
    restart: unless-stopped
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8000:80'
    depends_on:
      - api
    restart: unless-stopped
  ui:
    build: .
    command: ["streamlit","run","app.py","--server.address=0.0.0.0","--server.port=8501","--server.headless=true"]
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Set ADMIN_TOKEN in your .env}
      - API_URL=http://gateway
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs:ro
    ports:
      - '8501:8501'
    depends_on:
      - gateway
    restart: unless-stopped
